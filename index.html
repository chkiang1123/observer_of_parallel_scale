<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Observer Deck - iPad Monitor</title>
    <!-- SheetJS for resilient online data parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --red: #ff4d4d;
            --orange: #ffa500;
            --green: #2ecc71;
            --blue: #3498db;
            --purple: #9b59b6;
            --gold: #d4af37;
            --silver: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1f;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* --- IPAD WORKSPACE GRID --- */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            flex-grow: 1;
        }

        .scale-column {
            background: #25252d;
            padding: 16px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        /* Scaled-down title headers */
        .scale-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }

        /* --- GRAPHIC CONTAINER WITH SAFE MARGINS --- */
        .scale-graphic-container {
            flex-grow: 1;
            min-height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            background: #141419;
            border-radius: 12px;
            padding: 0 20px 20px 20px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .scale-base {
            width: 140px;
            height: 12px;
            background: #444;
            border-radius: 4px 4px 0 0;
            position: relative;
            z-index: 1;
        }

        .scale-pillar {
            width: 18px;
            height: 210px;
            background: #666;
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* Centered Beam with safe max-width to eliminate side clipping */
        .scale-beam-assembly {
            position: absolute;
            top: 85px;
            left: 50%;
            width: 76%;
            max-width: 360px;
            transform: translateX(-50%) rotate(0deg);
            transform-origin: center center;
            z-index: 2;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .scale-beam {
            width: 100%;
            height: 10px;
            position: relative;
            border-radius: 4px;
        }
        .primary-col .scale-beam { background: var(--gold); }
        .secondary-col .scale-beam { background: var(--silver); }

        .hanger {
            position: absolute;
            top: 10px;
            width: 3px;
            height: 50px;
            background: #888;
            transform-origin: top center;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .hanger-left { left: 25px; }
        .hanger-right { right: 25px; }

        /* Pan with double-shelf: blocks at bottom, loose cubes on top */
        .pan {
            position: absolute;
            top: 50px;
            width: 130px;
            height: 140px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed #444;
            border-bottom: 6px solid #555;
            border-radius: 6px 6px 12px 12px;
            transform: translateX(-50%) rotate(0deg);
            transform-origin: top center;
            display: flex;
            flex-direction: column-reverse;
            justify-content: flex-start;
            padding: 8px;
            gap: 5px;
            box-sizing: border-box;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .pan-left { left: 50%; }
        .pan-right { left: 50%; }

        /* Shelf 1 (Bottom): Heavy aggregate x10 / summary blocks */
        .pan-blocks-shelf {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        /* Shelf 2 (Top): Loose individual cubes (< 10) */
        .pan-cubes-shelf {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-content: flex-start;
            gap: 4px;
            width: 100%;
        }

        /* Summary block for count >= 10 */
        .color-row-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 24px;
            padding: 0 8px;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 12px;
            font-weight: 800;
            color: #000;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.3);
            animation: dropFromSky 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Individual cube sprites (< 10) */
        .cube-sprite {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
        }

        .cube-sprite.dropping {
            animation: dropFromSky 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes dropFromSky {
            0% { transform: translateY(-260px) scale(1.3); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Result Banners */
        .result-box {
            background: #111;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 14px;
            border-left: 6px solid #555;
            transition: all 0.3s ease;
            opacity: 0.3;
        }
        .result-box.active { opacity: 1; }
        .balanced { color: #2ecc71; border-left-color: #2ecc71; }
        .left-heavy { color: #f1c40f; border-left-color: #f1c40f; }
        .right-heavy { color: #e67e22; border-left-color: #e67e22; }

        /* --- CONTROL ACTIONS --- */
        .bottom-actions {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .btn-update {
            background-color: #3498db;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 16px 70px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(52, 152, 219, 0.4);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .btn-update:hover { background-color: #2980b9; }
        .btn-update:active { transform: scale(0.97); }
        .btn-update:disabled { background-color: #555; box-shadow: none; cursor: not-allowed; }

        .status-text {
            color: #aaa;
            font-size: 15px;
            font-style: italic;
            min-height: 22px;
            text-align: center;
        }

        /* --- RECORD LOG SECTION --- */
        #observer-record-section {
            width: 100%;
            background: #25252d;
            border-radius: 14px;
            padding: 16px 20px;
            box-sizing: border-box;
            margin-top: 20px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }

        #observer-record-section h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: #fff;
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.07);
            padding-bottom: 8px;
        }

        #record-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .record-placeholder {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 12px;
            font-size: 14px;
        }

        .record-item {
            background: #1f1f26;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #3498db;
            line-height: 1.5;
        }

        .record-meta {
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #record-list::-webkit-scrollbar { width: 6px; }
        #record-list::-webkit-scrollbar-track { background: #1f1f26; }
        #record-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="workspace-grid">
            
            <!-- PRIMARY SCALE -->
            <div class="scale-column primary-col">
                <div class="scale-title" style="color: var(--gold);">★ Primary Scale</div>
                <div class="scale-graphic-container">
                    <div class="scale-base"><div class="scale-pillar"></div></div>
                    <div id="beam-p" class="scale-beam-assembly">
                        <div class="scale-beam">
                            <div class="hanger hanger-left" id="hanger-p-l">
                                <div class="pan pan-left" id="pan-p-l">
                                    <div class="pan-cubes-shelf" id="cubes-p-l"></div>
                                    <div class="pan-blocks-shelf" id="blocks-p-l"></div>
                                </div>
                            </div>
                            <div class="hanger hanger-right" id="hanger-p-r">
                                <div class="pan pan-right" id="pan-p-r">
                                    <div class="pan-cubes-shelf" id="cubes-p-r"></div>
                                    <div class="pan-blocks-shelf" id="blocks-p-r"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="result-p" class="result-box balanced">⚖️ BALANCED</div>
            </div>

            <!-- SECONDARY SCALE -->
            <div class="scale-column secondary-col">
                <div class="scale-title" style="color: var(--silver);">🌙 Secondary Scale</div>
                <div class="scale-graphic-container">
                    <div class="scale-base"><div class="scale-pillar"></div></div>
                    <div id="beam-s" class="scale-beam-assembly">
                        <div class="scale-beam">
                            <div class="hanger hanger-left" id="hanger-s-l">
                                <div class="pan pan-left" id="pan-s-l">
                                    <div class="pan-cubes-shelf" id="cubes-s-l"></div>
                                    <div class="pan-blocks-shelf" id="blocks-s-l"></div>
                                </div>
                            </div>
                            <div class="hanger hanger-right" id="hanger-s-r">
                                <div class="pan pan-right" id="pan-s-r">
                                    <div class="pan-cubes-shelf" id="cubes-s-r"></div>
                                    <div class="pan-blocks-shelf" id="blocks-s-r"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="result-s" class="result-box balanced">⚖️ BALANCED</div>
            </div>

        </div>

        <div class="bottom-actions">
            <button id="btn-update" class="btn-update" onclick="fetchUpdate()">🔄 Update Display</button>
            <div id="status-text" class="status-text">Ready.</div>
        </div>

        <!-- OBSERVATION LOG -->
        <div id="observer-record-section">
            <h3>📝 Calculation History & Record Log</h3>
            <div id="record-list">
                <div class="record-placeholder">No records loaded yet. Tap "🔄 Update Display" to sync calculations.</div>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1M6_B8ccgFx1ud7zTLGTBsnkgVyKuYa3NJxqIhPm-_dQ';
        const colors = ['red', 'orange', 'green', 'blue', 'purple'];
        const colorLabels = { red: 'Red', orange: 'Orange', green: 'Green', blue: 'Blue', purple: 'Purple' };

        let currentState = {
            p: { l: {red:0, orange:0, green:0, blue:0, purple:0}, r: {red:0, orange:0, green:0, blue:0, purple:0} },
            s: { l: {red:0, orange:0, green:0, blue:0, purple:0}, r: {red:0, orange:0, green:0, blue:0, purple:0} }
        };

        let lastProcessedKey = null;
        let animationQueue = [];
        let pendingResultData = null;

        function fetchUpdate() {
            const btn = document.getElementById('btn-update');
            const status = document.getElementById('status-text');
            btn.disabled = true;
            status.innerText = "Checking sheet for new records...";

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(processData)
                    .withFailureHandler(err => {
                        fetchFromGoogleSheetDirect();
                    })
                    .getLatestScaleData();
            } else {
                fetchFromGoogleSheetDirect();
            }
        }

        function fetchFromGoogleSheetDirect() {
            const status = document.getElementById('status-text');
            const btn = document.getElementById('btn-update');
            const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;

            fetch(csvUrl)
                .then(res => {
                    if (!res.ok) throw new Error("Could not access sheet online.");
                    return res.text();
                })
                .then(csvText => {
                    parseCsvData(csvText);
                })
                .catch(err => {
                    status.innerText = "Fetch Error: " + err.message;
                    btn.disabled = false;
                });
        }

        function parseCsvData(csvText) {
            const workbook = XLSX.read(csvText, { type: 'string' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            if (!jsonRows || jsonRows.length <= 1) {
                document.getElementById('status-text').innerText = "No calculations found in sheet yet.";
                document.getElementById('btn-update').disabled = false;
                return;
            }

            const headers = jsonRows[0].map(h => String(h).toLowerCase().trim());
            const lastRow = jsonRows[jsonRows.length - 1];

            function findCol(keywords, defaultIndex) {
                for (let i = 0; i < headers.length; i++) {
                    if (keywords.every(kw => headers[i].includes(kw))) return i;
                }
                return defaultIndex;
            }

            const formattedData = {
                rowNumber: jsonRows.length,
                sheetName: "Google Sheet",
                timestamp: String(lastRow[findCol(['time'], 0)] || new Date().toLocaleTimeString()),
                weights: String(lastRow[findCol(['weight'], 1)] || ""),
                primaryLeft: String(lastRow[findCol(['primary', 'left'], 2)] || ""),
                primaryRight: String(lastRow[findCol(['primary', 'right'], 3)] || ""),
                primaryResult: String(lastRow[findCol(['primary', 'result'], 4)] || "⚖️ BALANCED"),
                secondaryLeft: String(lastRow[findCol(['secondary', 'left'], 5)] || ""),
                secondaryRight: String(lastRow[findCol(['secondary', 'right'], 6)] || ""),
                secondaryResult: String(lastRow[findCol(['secondary', 'result'], 7)] || "⚖️ BALANCED")
            };

            processData(formattedData);
        }

        function parsePanString(str) {
            let res = {red:0, orange:0, green:0, blue:0, purple:0};
            if (!str || typeof str !== 'string') return res;
            let s = str.trim();
            if (s === '' || s.toLowerCase() === 'empty') return res;

            let items = s.replace(/\|/g, ',').replace(/;/g, ',').split(',');

            items.forEach(item => {
                let trimmed = item.trim();
                if (!trimmed) return;

                let colonMatch = trimmed.match(/^([a-zA-Z]+)\s*[:=]\s*(\d+)/);
                if (colonMatch) {
                    applyColorQty(res, colonMatch[1].toLowerCase(), parseInt(colonMatch[2], 10));
                    return;
                }

                let qtyColorMatch = trimmed.match(/^(\d+)\s*([a-zA-Z]+)/);
                if (qtyColorMatch) {
                    applyColorQty(res, qtyColorMatch[2].toLowerCase(), parseInt(qtyColorMatch[1], 10));
                    return;
                }
            });

            return res;
        }

        function applyColorQty(res, key, qty) {
            if (isNaN(qty)) return;
            if (key === 'red' || key === 'r') res.red = qty;
            else if (key === 'orange' || key === 'o') res.orange = qty;
            else if (key === 'green' || key === 'g') res.green = qty;
            else if (key === 'blue' || key === 'b') res.blue = qty;
            else if (key === 'purple' || key === 'p') res.purple = qty;
        }

        function processData(data) {
            const btn = document.getElementById('btn-update');
            const status = document.getElementById('status-text');

            if (!data) {
                status.innerText = "No response from Google Sheet.";
                btn.disabled = false;
                return;
            }
            if (data.empty) {
                status.innerText = data.message;
                btn.disabled = false;
                return;
            }
            if (data.error) {
                status.innerText = "Sheet Error: " + data.error;
                btn.disabled = false;
                return;
            }

            const targetStates = {
                p: { l: parsePanString(data.primaryLeft), r: parsePanString(data.primaryRight) },
                s: { l: parsePanString(data.secondaryLeft), r: parsePanString(data.secondaryRight) }
            };

            let totalAdded = 0;
            let requiresHardReset = false;
            animationQueue = [];

            ['p', 's'].forEach(scale => {
                ['l', 'r'].forEach(side => {
                    colors.forEach(color => {
                        let oldQty = currentState[scale][side][color];
                        let newQty = targetStates[scale][side][color];
                        let diff = newQty - oldQty;

                        if (diff < 0) {
                            requiresHardReset = true;
                        } else if (diff > 0) {
                            // If resulting count >= 10, queue as summary block
                            if (newQty >= 10) {
                                animationQueue.push({ type: 'block', scale, side, color, count: newQty });
                                totalAdded += diff;
                            } else {
                                // If < 10, queue as individual cubes
                                for (let i = 0; i < diff; i++) {
                                    animationQueue.push({ type: 'cube', scale, side, color });
                                }
                                totalAdded += diff;
                            }
                        }
                    });
                });
            });

            const currentKey = `${data.rowNumber}-${data.primaryLeft}-${data.primaryRight}-${data.secondaryLeft}-${data.secondaryRight}`;
            if (!requiresHardReset && totalAdded === 0 && lastProcessedKey === currentKey) {
                status.innerText = `✓ Up to date with Row #${data.rowNumber}. No new changes.`;
                btn.disabled = false;
                return;
            }

            lastProcessedKey = currentKey;
            pendingResultData = data;
            
            resetScaleRotations();

            if (requiresHardReset) {
                status.innerText = `Syncing scale state (Row #${data.rowNumber})...`;
                currentState = JSON.parse(JSON.stringify(targetStates));
                hardRenderAllPans();
                animationQueue = [];
                triggerSwings();
            } else if (animationQueue.length > 0) {
                status.innerText = `Adding ${totalAdded} cube(s)...`;
                processQueue();
            } else {
                triggerSwings();
            }
        }

        // Sequential animation: drops cubes (<10) or landing summary block (>=10)
        function processQueue() {
            if (animationQueue.length === 0) {
                setTimeout(triggerSwings, 500);
                return;
            }

            let task = animationQueue.shift();

            if (task.type === 'cube') {
                currentState[task.scale][task.side][task.color] += 1;
                let container = document.getElementById(`cubes-${task.scale}-${task.side}`);
                let cube = document.createElement('div');
                cube.className = 'cube-sprite dropping';
                cube.style.backgroundColor = `var(--${task.color})`;
                container.appendChild(cube);
            } else if (task.type === 'block') {
                currentState[task.scale][task.side][task.color] = task.count;
                renderPan(task.scale, task.side, currentState, task.color);
            }

            setTimeout(processQueue, 300);
        }

        // Renders pan: blocks (>=10) at bottom, loose cubes (<10) above
        function renderPan(scale, side, stateObj, animatedColor = null) {
            let cubesEl = document.getElementById(`cubes-${scale}-${side}`);
            let blocksEl = document.getElementById(`blocks-${scale}-${side}`);
            cubesEl.innerHTML = '';
            blocksEl.innerHTML = '';

            colors.forEach(color => {
                let count = stateObj[scale][side][color];
                if (count >= 10) {
                    let strip = document.createElement('div');
                    strip.className = 'color-row-strip';
                    if (animatedColor === color) {
                        strip.classList.add('dropping');
                    }
                    strip.style.backgroundColor = `var(--${color})`;
                    strip.innerHTML = `<span>${colorLabels[color]}</span><span>x${count}</span>`;
                    blocksEl.appendChild(strip);
                } else if (count > 0) {
                    for (let i = 0; i < count; i++) {
                        let cube = document.createElement('div');
                        cube.className = 'cube-sprite';
                        cube.style.backgroundColor = `var(--${color})`;
                        cubesEl.appendChild(cube);
                    }
                }
            });
        }

        function hardRenderAllPans() {
            ['p', 's'].forEach(scale => {
                ['l', 'r'].forEach(side => {
                    renderPan(scale, side, currentState);
                });
            });
        }

        function resetScaleRotations() {
            ['p', 's'].forEach(scale => {
                document.getElementById(`beam-${scale}`).style.transform = `translateX(-50%) rotate(0deg)`;
                document.getElementById(`pan-${scale}-l`).style.transform = `translateX(-50%) rotate(0deg)`;
                document.getElementById(`pan-${scale}-r`).style.transform = `translateX(-50%) rotate(0deg)`;
                document.getElementById(`result-${scale}`).classList.remove("active");
            });
        }

        function applySwingToScale(scale, resultText) {
            let beam = document.getElementById(`beam-${scale}`);
            let panL = document.getElementById(`pan-${scale}-l`);
            let panR = document.getElementById(`pan-${scale}-r`);
            let resBox = document.getElementById(`result-${scale}`);

            let angle = 0;
            let finalClass = "balanced";

            if (resultText && resultText.includes("LEFT")) {
                angle = -8;
                finalClass = "left-heavy";
            } else if (resultText && resultText.includes("RIGHT")) {
                angle = 8;
                finalClass = "right-heavy";
            }

            // Preserves translateX(-50%) so pans stay perfectly centered without side clipping
            beam.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            panL.style.transform = `translateX(-50%) rotate(${-angle}deg)`;
            panR.style.transform = `translateX(-50%) rotate(${-angle}deg)`;

            resBox.className = `result-box active ${finalClass}`;
            resBox.innerHTML = resultText || "⚖️ BALANCED";
        }

        function addRecordLogItem(data) {
            const list = document.getElementById('record-list');
            const placeholder = list.querySelector('.record-placeholder');
            if (placeholder) { list.innerHTML = ''; }

            const pInfo = `<span style="color:var(--gold); font-weight:bold;">★ Primary:</span> Left [${data.primaryLeft || 'Empty'}] vs Right [${data.primaryRight || 'Empty'}] ➔ <b>${data.primaryResult}</b>`;
            const sInfo = `<span style="color:var(--silver); font-weight:bold;">🌙 Secondary:</span> Left [${data.secondaryLeft || 'Empty'}] vs Right [${data.secondaryRight || 'Empty'}] ➔ <b>${data.secondaryResult}</b>`;

            const item = document.createElement('div');
            item.className = 'record-item';
            item.innerHTML = `
                <div class="record-meta">Row #${data.rowNumber} (${data.sheetName}) • Time: ${data.timestamp}</div>
                <div>${pInfo}</div>
                <div style="margin-top:4px;">${sInfo}</div>
            `;
            list.insertBefore(item, list.firstChild);
        }

        function triggerSwings() {
            if (pendingResultData) {
                applySwingToScale('p', pendingResultData.primaryResult);
                applySwingToScale('s', pendingResultData.secondaryResult);
                addRecordLogItem(pendingResultData);
                document.getElementById('status-text').innerText = `✓ Updated to Row #${pendingResultData.rowNumber}.`;
            }
            document.getElementById('btn-update').disabled = false;
        }
    </script>
</body>
</html>
